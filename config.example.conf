# DHCP Gadget config (key=value)
# Required keys: subnet, pool_start, pool_end

subnet=192.168.8.0/24
server_ip=192.168.8.1
lease_time=900
pool_start=192.168.8.100
pool_end=192.168.8.200

# Optional: bridge the daemon creates for all gadget ports; it carries
# server_ip with the subnet prefix. Default: gadget0
# bridge=gadget0

# Optional: router option in DHCP replies
# router=192.168.8.1

# Optional: comma-separated DNS servers
# dns=1.1.1.1,8.8.8.8

# Optional: repeat custom DHCP options as decimal-code=colon-separated-hex-bytes
# custom_option=42=c0:a8:08:02
# custom_option=224=01:02:ff

# Optional: repeat static_lease entries
static_lease=1-2:1.0=192.168.8.10
static_lease=1-3:1.0=192.168.8.11

# dhcp-gadgetd configuration: one key=value per line.
# Restart after editing: sudo systemctl restart dhcp-gadget.service
# Full reference: README.md, section "Configuration".

# Network served to gadgets (required). server_ip is the host's address on the
# bridge; it defaults to the first host address of the subnet.
subnet=192.168.8.0/24
server_ip=192.168.8.1

# Dynamic pool for ports without a static lease (required, inclusive).
# Keep server_ip, router, and static lease addresses outside it.
pool_start=192.168.8.100
pool_end=192.168.8.200

# Lease duration in seconds (default 86400).
lease_time=900

# Bridge the daemon creates for all gadget ports (default gadget0).
# bridge=gadget0

# Router and DNS servers sent to gadgets; not sent when omitted.
# router=192.168.8.1
# dns=1.1.1.1,8.8.8.8

# Fixed address per USB port, repeatable: static_lease=<usb path>=<address>
# Print a port's USB path from its interface name (bridge link show master gadget0):
#   basename "$(readlink -f /sys/class/net/<interface>/device)"
static_lease=1-2:1.0=192.168.8.10
static_lease=1-3:1.0=192.168.8.11

# Extra DHCP options, repeatable: custom_option=<decimal code>=<colon-separated hex bytes>
# custom_option=42=c0:a8:08:02
# custom_option=224=01:02:ff
